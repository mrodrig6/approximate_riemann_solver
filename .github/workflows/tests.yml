name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[plot,test]'
      - name: Verify actual Numba-absent fallback
        run: python -c "import importlib.util; assert importlib.util.find_spec('numba') is None"
      - run: python -m pytest -q
  accelerated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[all]'
      - run: python -m pytest -q
      - run: NUMBA_DISABLE_JIT=1 python -m pytest -q
