[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "approximate-riemann-solver"
version = "1.0.0"
description = "Exact and approximate (Roe) Riemann solvers for the 1-D Euler equations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mauro Rodriguez Jr.", email = "mauro_rodriguez@brown.edu" },
]
keywords = [
    "riemann-solver", "euler-equations", "godunov", "roe-solver",
    "computational-fluid-dynamics", "tvd", "shock-tube",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
# Numba is optional: without it every kernel still runs, just ~100x slower.
fast = ["numba>=0.57"]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
all = ["numba>=0.57", "matplotlib>=3.5", "pytest>=7.0"]
docs = ["mkdocs-material>=9.6,<10"]
dev = [
    "ruff>=0.11,<1",
    "codespell>=2.4,<3",
    "mdformat==0.7.22",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
    "mdformat-tables==1.0.0",
    "mdformat-dollarmath==0.0.5",
]

[project.scripts]
riemann = "src.cli:main"

[project.urls]
Homepage = "https://github.com/mrodrig6/approximate_riemann_solver"
Documentation = "https://github.com/mrodrig6/approximate_riemann_solver/blob/master/docs/index.md"

[tool.setuptools]
packages = [
    "src",
    "src.core",
    "src.euler",
    "src.euler.fluxes",
    "src.shallow_water",
    "src.shallow_water.fluxes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.codespell]
skip = ".git,.venv,site,*.egg-info,*.png,*.pdf,__pycache__,.pytest_cache,.ruff_cache"
ignore-words-list = "ader,ausm,nd,ro"
